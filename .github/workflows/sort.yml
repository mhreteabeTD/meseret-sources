name: Apply file moves
on: workflow_dispatch
permissions: { contents: write }
jobs:
  sort:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/apply_moves.py
      - name: Commit and push
        run: |
          git config user.name "Mhreteabe Tesfaye"; git config user.email "mhreteabetesfaye71624@gmail.com"
          git rm -q tools/moves.json tools/apply_moves.py || echo "::warning::git rm failed"
          git status --short | head -3
          out=$(git commit -qm "Sort Grade 9-12 textbooks, guides, exam and reference books into place" -m "Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_013QZp8t8CweNwXw9pzAksCe" 2>&1) || { echo "::error::commit failed: $(echo "$out" | tail -4 | tr '\n' '|')"; exit 1; }
          for i in 1 2 3; do out=$(git push 2>&1) && exit 0; echo "::warning::push $i: $(echo "$out" | tail -6 | tr '\n' '|')"; sleep 15; done
          echo "::error::push failed: $(echo "$out" | tail -6 | tr '\n' '|')"; exit 1
